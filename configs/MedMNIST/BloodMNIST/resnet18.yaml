num_classes: 8
epochs: 100
grad_clip: 5.0
log_frequency: 20

model:
  name: ResNet18
  num_classes: 8
  n_channel: 3

criterion:
  name: CrossEntropyLoss

optimizer:
  name: SGD
  lr: 0.1
  weight_decay: 5.e-4
  momentum: 0.9

scheduler:
  name: CosineAnnealingLR
  T_max: $epochs
  eta_min: 0.0

dataset:
  name: DatasetGenerator
  train_batch_size: 128
  eval_batch_size: 128
