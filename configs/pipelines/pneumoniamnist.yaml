# Extra-server 2D pipeline: grayscale binary PneumoniaMNIST (converted to RGB).
dataset:
  name: PneumoniaMNIST
  poison_name: PoisonPneumoniaMNIST
  modality: 2d_image
  task_type: binary
  num_classes: 2
  config_path: configs/MedMNIST/PneumoniaMNIST
  data_path: ../datasets
  noise_shape: [4708, 3, 28, 28]
  test_noise_shape: [624, 3, 28, 28]

models:
  surrogate: resnet18
  victim: resnet18

experiment:
  attack_type: datacook
  epsilon_scale: pixel
  step_size_ratio: 0.2
  num_steps: 20
  universal_stop_error: 0.01

seeds: [0, 1, 2, 3, 4, 5, 6, 7]
epsilons: [2, 4, 8, 12, 16]

runtime:
  python: python
  train_batch_size: 128
  eval_batch_size: 128
  num_workers: 8

experiment_root: experiments/revision_pipeline_extra2d
result_root: results/revision_pipeline_extra2d
