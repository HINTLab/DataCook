experiments:
- metadata:
    dataset: ChestMNIST
    modality: 2d_image
    task_type: multilabel
    method: datacook
    surrogate_model: resnet18
    victim_model: resnet18
    seed: 0
    epsilon: 0.03137254901960784
  num_classes: 14
  predictions:
    clean: ../../../../experiments/revision_pipeline_multilabel/ChestMNIST-datacook-sur=resnet18-vic=resnet18-seed=0-eps=8/predictions/clean.npz
    authorized_cooked: ../../../../experiments/revision_pipeline_multilabel/ChestMNIST-datacook-sur=resnet18-vic=resnet18-seed=0-eps=8/predictions/authorized_cooked.npz
    unauthorized_raw: ../../../../experiments/revision_pipeline_multilabel/ChestMNIST-datacook-sur=resnet18-vic=resnet18-seed=0-eps=8/predictions/unauthorized_raw.npz
  model:
    config_path: ../../../MedMNIST/ChestMNIST/resnet18.yaml
    checkpoint: ../../../../experiments/revision_pipeline_multilabel/ChestMNIST-datacook-sur=resnet18-vic=resnet18-seed=0-eps=8/protected/resnet18/checkpoints/resnet18.pth
  eval_data: &id001
    inputs: ../../../../artifacts/revision_pipeline_multilabel/ChestMNIST/raw_test.npz::images
    labels: ../../../../artifacts/revision_pipeline_multilabel/ChestMNIST/raw_test.npz::labels
  attacks:
  - type: finetune
    epochs: 5
    learning_rate: 0.0001
    batch_size: 64
    raw_subset: &id002
      inputs: ../../../../artifacts/revision_pipeline_multilabel/ChestMNIST/raw_val.npz::images
      labels: ../../../../artifacts/revision_pipeline_multilabel/ChestMNIST/raw_val.npz::labels
    eval_data: *id001
  - type: finetune
    epochs: 10
    learning_rate: 0.0001
    batch_size: 64
    raw_subset: *id002
    eval_data: *id001
  - type: robust_finetune
    epochs: 5
    learning_rate: 0.0001
    batch_size: 64
    augmentation_strength: 2
    raw_subset: *id002
    eval_data: *id001
  - type: robust_finetune
    epochs: 10
    learning_rate: 0.0001
    batch_size: 64
    augmentation_strength: 2
    raw_subset: *id002
    eval_data: *id001
