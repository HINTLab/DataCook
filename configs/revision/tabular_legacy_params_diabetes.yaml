dataset:
  name: Diabetes
  task_type: binary
  num_classes: 2
  data_path: ../../TableData/dataset/diabetes.csv
  features:
    - Pregnancies
    - Glucose
    - BloodPressure
    - SkinThickness
    - Insulin
    - BMI
    - DiabetesPedigreeFunction
    - Age
  target: Outcome
  test_size: 0.2

model:
  hidden_dims: [64, 32]
  dropout: 0.3

experiment:
  # Budget ablation using the legacy optimizer settings.
  seeds: [0, 1, 2]
  epsilons: [0.1, 0.25, 0.5, 1.0, 2.0, 5.0]
  attackable_features: [BMI, DiabetesPedigreeFunction]
  num_steps: 300
  step_size: 0.05
  baseline_epochs: 100
  protected_epochs: 100
  batch_size: 32
  learning_rate: 0.001
  class_balance: false

outputs:
  artifact_root: artifacts/revision_pipeline_tabular_legacy_params
  result_root: results/revision_pipeline_tabular_legacy_params/datasets/diabetes
