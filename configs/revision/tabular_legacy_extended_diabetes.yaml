dataset:
  name: Diabetes
  task_type: binary
  num_classes: 2
  data_path: ../../TableData/dataset/diabetes.csv
  features: [Pregnancies, Glucose, BloodPressure, SkinThickness, Insulin, BMI, DiabetesPedigreeFunction, Age]
  target: Outcome
  test_size: 0.2

model:
  hidden_dims: [64, 32]
  dropout: 0.3
  baseline_checkpoint: ../../TableData/TableData_oldversion/best_model_diabete.pt
  require_baseline_checkpoint: true

experiment:
  # Fixed historical split/checkpoint; seeds vary victim initialization only.
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  split_seed: 42
  epsilons: [0.1, 0.25, 0.5, 1.0, 2.0, 5.0]
  attackable_features: [BMI, DiabetesPedigreeFunction]
  num_steps: 300
  step_size: 0.05
  baseline_epochs: 100
  protected_epochs: 100
  batch_size: 32
  learning_rate: 0.001
  class_balance: false
  stratify_split: false
  preprocess_on_full_data: true
  protected_shuffle: false
  protected_global_data_order: true
  victim_seed_offset: 0
  protected_seed_offset: 0
  victim_initialization_count: 2
  victim_deepcopy_template: true
  historical_loader_rng_draws_before_training: 2
  reset_rng_each_epsilon: true

outputs:
  artifact_root: artifacts/revision_pipeline_tabular_legacy_extended
  result_root: results/revision_pipeline_tabular_legacy_extended/datasets/diabetes
